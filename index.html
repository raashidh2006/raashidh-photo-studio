<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPix Enhancer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>QuickPix Enhancer</h1>
        
        <div class="upload-section">
            <input type="file" id="upload" accept="image/*" hidden>
            <label for="upload" class="btn upload-btn">Choose an Image</label>
        </div>

        <div class="editor-layout">
            <div class="canvas-container">
                <canvas id="imageCanvas"></canvas>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="brightness">Brightness</label>
                    <input type="range" id="brightness" min="0" max="200" value="100">
                </div>

                <div class="control-group">
                    <label for="contrast">Contrast</label>
                    <input type="range" id="contrast" min="0" max="200" value="100">
                </div>

                <div class="control-group">
                    <label for="grayscale">Grayscale</label>
                    <input type="range" id="grayscale" min="0" max="100" value="0">
                </div>

                <div class="control-group">
                    <label for="blur">Blur</label>
                    <input type="range" id="blur" min="0" max="10" value="0" step="0.1">
                </div>

                <button id="download" class="btn download-btn" disabled>Download Image</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
